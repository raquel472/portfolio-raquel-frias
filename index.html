<body style="margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F4EFE6;color:#292824;font-family:system-ui,sans-serif">
<a href="Portfolio.dc.html">Raquel Frias — Portfólio</a>
<script>
  // Links de convite / recuperação de senha chegam aqui com um token no endereço.
  if (/(invite|recovery|confirmation|email_change)_token=/.test(location.hash)) {
    window.netlifyIdentity && netlifyIdentity.on('login', function () { location.href = 'Editor.dc.html'; });
  } else {
    location.replace('Portfolio.dc.html');
  }
</script>
</body>
