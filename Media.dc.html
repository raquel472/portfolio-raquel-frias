<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;width:100%;height:100%;overflow:hidden;background:{{ bg }};">
  <sc-if value="{{ showImg }}" hint-placeholder-val="{{ false }}">
    <img src="{{ src }}" alt="{{ alt }}" loading="lazy" decoding="async" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.2s cubic-bezier(.2,.8,.2,1);" style-hover="transform:scale(1.035);">
  </sc-if>
  <sc-if value="{{ showVideo }}" hint-placeholder-val="{{ false }}">
    <video src="{{ src }}" controls="{{ true }}" playsInline="{{ true }}" preload="metadata" aria-label="{{ alt }}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#292824;"></video>
  </sc-if>
  <sc-if value="{{ showIframe }}" hint-placeholder-val="{{ false }}">
    <iframe src="{{ embed }}" title="{{ alt }}" loading="lazy" allow="autoplay; encrypted-media; picture-in-picture; clipboard-write" allowFullScreen="{{ true }}" style="position:absolute;inset:0;width:100%;height:100%;border:0;background:#FFFFFF;"></iframe>
  </sc-if>
  <sc-if value="{{ showPlaceholder }}" hint-placeholder-val="{{ true }}">
    <div aria-hidden="true" style="position:absolute;inset:0;background-image:repeating-linear-gradient(135deg, {{ stripe }} 0 1px, transparent 1px 14px);transition:transform 1.2s cubic-bezier(.2,.8,.2,1);" style-hover="transform:scale(1.035);"></div>
    <sc-if value="{{ showStaticPlay }}">
      <div aria-hidden="true" style="position:absolute;left:50%;top:50%;width:76px;height:76px;margin:-38px 0 0 -38px;border:1px solid {{ fg }};border-radius:50%;display:flex;align-items:center;justify-content:center;color:{{ fg }};font-size:20px;pointer-events:none;">▶</div>
    </sc-if>
    <div style="position:absolute;left:16px;right:16px;bottom:14px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;font-family:'Schibsted Grotesk',system-ui,sans-serif;font-size:10.5px;line-height:1.4;letter-spacing:.14em;text-transform:uppercase;color:{{ fg }};pointer-events:none;">
      <span style="flex:0 0 auto;">{{ kindLabel }}</span>
      <span style="text-align:right;min-width:0;">{{ label }}</span>
    </div>
  </sc-if>
  <sc-if value="{{ showPlay }}" hint-placeholder-val="{{ false }}">
    <button type="button" onClick="{{ play }}" aria-label="{{ playLabel }}" style="position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:{{ fg }};font-family:'Schibsted Grotesk',system-ui,sans-serif;font-size:11px;letter-spacing:.16em;text-transform:uppercase;">
      <span style="width:76px;height:76px;border:1px solid {{ fg }};border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;transition:transform .4s cubic-bezier(.2,.8,.2,1), background .4s;" style-hover="transform:scale(1.08);">▶</span>
      <span>Assistir</span>
    </button>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:480,&quot;height&quot;:320},&quot;src&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;alt&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Capa do projeto&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;wine&quot;,&quot;caramel&quot;,&quot;ink&quot;,&quot;graphite&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;image&quot;,&quot;video&quot;],&quot;default&quot;:&quot;image&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;embed&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { playing: false };
  renderVals() {
    const p = this.props;
    const src = p.src || '', embed = p.embed || '', kind = p.kind || 'image';
    const tones = {
      light: ['#E6DDCD', '#4A4740', 'rgba(41,40,36,.07)'],
      wine: ['#6D263D', '#F4EFE6', 'rgba(244,239,230,.08)'],
      caramel: ['#D7A66D', '#292824', 'rgba(41,40,36,.09)'],
      ink: ['#292824', '#F4EFE6', 'rgba(244,239,230,.06)'],
      graphite: ['#3A3833', '#F4EFE6', 'rgba(244,239,230,.07)']
    };
    const [bg, fg, stripe] = tones[p.tone] || tones.light;
    const isVid = kind === 'video' || /\.(mp4|webm|mov)(\?|$)/i.test(src);
    const playing = this.state.playing;
    const showImg = !!src && !isVid;
    const showVideo = !!src && isVid;
    const showIframe = !src && !!embed && playing;
    const showPlay = !src && !!embed && !playing;
    const showPlaceholder = !src && !showIframe;
    return {
      src, embed, bg, fg, stripe,
      alt: p.alt || p.label || '',
      label: p.label || '',
      showImg, showVideo, showIframe, showPlay, showPlaceholder,
      showStaticPlay: showPlaceholder && !embed && isVid,
      kindLabel: embed ? (/youtu/.test(embed) ? 'YouTube' : /vimeo/.test(embed) ? 'Vimeo' : 'Instagram · Reel') : isVid ? 'Vídeo a enviar' : 'Imagem a enviar',
      playLabel: 'Assistir: ' + (p.label || 'vídeo'),
      play: () => this.setState({ playing: true })
    };
  }
}
</script>
</body>
</html>
